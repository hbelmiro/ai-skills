[project]
name = "ai-skills"
version = "0.8.0"
description = "A monorepo for AI skills and projects with shared utilities and standardized structure"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pyyaml",
]

[dependency-groups]
lint = ["ruff", "ty", "yamllint"]
test = ["pytest"]
security = ["pip-audit"]
git-hooks = ["pre-commit"]
dev = [
    {include-group = "lint"},
    {include-group = "test"},
    {include-group = "security"},
    {include-group = "git-hooks"},
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]

[tool.ruff]
target-version = "py314"

[tool.ty]
environment.extra-paths = ["src"]
