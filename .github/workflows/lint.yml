name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Python
        run: uv python install 3.14

      - name: Install lint dependencies
        run: uv sync --group lint

      - name: Lint Python code with ruff
        run: uv run ruff check .

      - name: Check Python formatting with ruff
        run: uv run ruff format --check .

      - name: Type check Python code with ty
        run: uv run ty check .

  lint-yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Python
        run: uv python install 3.14

      - name: Install lint dependencies
        run: uv sync --group lint

      - name: Lint YAML files
        run: |
          find . -path "./.venv" -prune -o -path "./.git" -prune -o \
            \( -name "*.yml" -o -name "*.yaml" \) -print | \
            xargs uv run yamllint -c .yamllint.yml

  lint-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check links in markdown files
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: '--offline --no-progress "**/*.md"'
          fail: true
