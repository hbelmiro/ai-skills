name: uv lock check

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hbelmiro/uv-lock-check@b00eda7957c0ae48b5a1106ba19f3dc01b5888d5 # v0.4.0
