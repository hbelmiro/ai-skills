version: 2
updates:
  # Enable version updates for Python dependencies managed by uv
  - package-ecosystem: "uv"
    milestone: 13
    directory: "/"
    schedule:
      interval: "weekly"
    allow:
      - dependency-type: "all"
    labels:
      - "dependencies"
      - "uv"
      - "python"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    milestone: 13
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action/*"
